delete_orphaned_database_entities:
  alias: Delete orphaned database entities
  sequence:
  - action: homeassistant.list_orphaned_database_entities
    response_variable: orphaned
  - action: recorder.purge_entities
    target:
      entity_id: '{{ orphaned.entities }}

        '
    data:
      keep_days: 0
  mode: single
  description: ''
playbee_play_media_based_on_nfc_tag:
  alias: PlayBee | Play media based on NFC tag
  mode: single
  fields:
    tag_uid:
      description: The scanned NFC tag UID
      required: true
  sequence:
  - action: shell_command.playbee_db_get_tag_by_id
    data:
      tag_uid: '{{ tag_uid }}'
    response_variable: db_response
  - variables:
      tag: "{% if db_response.returncode == 0 and db_response.stdout | trim != ''
        %}\n  {{ db_response.stdout | from_json }}\n{% else %}\n  {{ {'found': false}
        }}\n{% endif %}"
      found: '{{ tag.found | default(false) }}'
      media_url: '{{ tag.media_url | default('''') }}'
      name: '{{ tag.name | default('''') }}'
      shuffle: '{{ tag.shuffle | default(false) }}'
      repeat_mode: '{{ tag.repeat_mode | default(''off'') }}'
      resume: '{{ tag.resume | default(false) }}'
      resume_data: '{{ tag.resume_data | default(none) }}'
      track_id: '{{ resume_data.track_id if resume_data else none }}'
      position: '{{ resume_data.position | int(0) if resume_data else 0 }}'
      queue_id: '{{ resume_data.queue_id if resume_data else none }}'
      do_resume: "{{\n  resume == true\n  and resume_data is not none\n  and track_id
        not in [none, '', 'unknown', 'unavailable']\n  and position | int(0) > 0\n
        \ and queue_id not in [none, '', 'unknown', 'unavailable']\n}}"
      media_player: media_player.googlehome2758
  - if:
    - condition: template
      value_template: '{{ not found or not media_url }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: Unknown or incomplete NFC tag in DB. tag_uid={{ tag_uid }}
    - stop: Unknown NFC tag
  - action: input_text.set_value
    target:
      entity_id: input_text.playbee_active_tag_uid
    data:
      value: '{{ tag_uid }}'
  - action: media_player.clear_playlist
    target:
      entity_id: '{{ media_player }}'
  - action: media_player.shuffle_set
    target:
      entity_id: '{{ media_player }}'
    data:
      shuffle: '{{ shuffle }}'
  - action: media_player.repeat_set
    target:
      entity_id: '{{ media_player }}'
    data:
      repeat: '{{ repeat_mode }}'
  - if:
    - condition: template
      value_template: '{{ do_resume }}'
    then:
    - action: rest_command.playbee_ma_resolve_item_by_uri
      data:
        uri: '{{ media_url }}'
      response_variable: resolved_item_response
    - if:
      - condition: template
        value_template: '{{ resolved_item_response.status == 200 }}'
      then:
      - variables:
          resolved_item: "{% set content = resolved_item_response.content if resolved_item_response
            is mapping else none %} {% if content is mapping %}\n  {{ content }}\n{%
            elif content is string %}\n  {{ content | from_json({}, default={}) }}\n{%
            else %}\n  {{ {} }}\n{% endif %}"
          resolved_media_url: '{{ resolved_item.get(''uri'', '''') }}'
          resolved_media_provider: '{{ resolved_item.get(''provider'', '''') }}'
          resolved_media_type: '{{ resolved_item.get(''media_type'', '''') }}'
      - if:
        - condition: template
          value_template: "{{\n  resolved_media_url in ['', 'unknown', 'unavailable']\n
            \ or resolved_media_provider != 'library'\n  or resolved_media_type !=
            'playlist'\n}}"
        then:
        - action: system_log.write
          data:
            level: warning
            logger: playbee.nfc
            message: Could not resolve internal library playlist URI. media_url={{
              media_url }}, resolved_item={{ resolved_item }}
        - stop: Invalid resolved playlist URI
      - action: system_log.write
        data:
          level: info
          logger: playbee.nfc
          message: 'PlayBee resuming: tag={{ tag_uid }}, external_media={{ media_url
            }}, resolved_media={{ resolved_media_url }}, track={{ track_id }}, position={{
            position }}'
      - action: rest_command.playbee_ma_resume
        data:
          queue_id: '{{ queue_id }}'
          track_id: '{{ track_id }}'
          media_url: '{{ resolved_media_url }}'
        response_variable: resume_response
      - if:
        - condition: template
          value_template: '{{ resume_response.status != 200 }}'
        then:
        - action: system_log.write
          data:
            level: error
            logger: playbee.nfc
            message: 'PlayBee resume failed: {{ resume_response }}'
        - stop: Resume failed
      - wait_template: '{{ states(media_player) in [''playing'', ''buffering''] }}'
        timeout: 00:00:10
        continue_on_timeout: true
      - action: media_player.media_seek
        target:
          entity_id: '{{ media_player }}'
        data:
          seek_position: '{{ position | int }}'
      else:
      - action: system_log.write
        data:
          level: error
          logger: playbee.nfc
          message: 'URI resolve failed: {{ resolved_item_response }}'
      - stop: URI resolve failed
    else:
    - action: shell_command.playbee_db_clear_resume
      data:
        tag_uid: '{{ tag_uid }}'
    - action: media_player.play_media
      target:
        entity_id: '{{ media_player }}'
      data:
        metadata: {}
        media:
          media_content_id: '{{ media_url }}'
          media_content_type: music
          metadata: {}
  description: ''
playbee_stop_media:
  alias: PlayBee | Stop media
  mode: single
  fields:
    reason:
      required: false
  sequence:
  - variables:
      media_player: media_player.googlehome2758
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      has_active_tag: '{{ active_tag_uid not in ['''', ''unknown'', ''unavailable'']
        }}'
  - action: script.playbee_save_resume
    data:
      reason: '{{ reason | default(''stop'') }}'
  - action: media_player.media_stop
    target:
      entity_id: '{{ media_player }}'
  - delay: 00:00:01
  - action: media_player.clear_playlist
    target:
      entity_id: '{{ media_player }}'
  - if:
    - condition: template
      value_template: '{{ has_active_tag }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.playbee_active_tag_uid
      data:
        value: ''
playbee_save_resume:
  alias: PlayBee | Save resume
  mode: single
  fields:
    reason:
      required: false
  sequence:
  - variables:
      media_player: media_player.googlehome2758
      queue_id: "{{\n  state_attr(media_player, 'active_queue')\n  or state_attr(media_player,
        'mass_queue_id')\n  or media_player\n}}"
  - action: rest_command.playbee_ma_get_queue
    data:
      queue_id: '{{ queue_id }}'
    response_variable: queue_response
  - if:
    - condition: template
      value_template: '{{ queue_response is mapping and queue_response.status == 200
        }}'
    then:
    - variables:
        queue_payload: "{% set content = queue_response.content if queue_response
          is mapping else none %} {% if content is mapping %}\n  {{ content }}\n{%
          elif content is string %}\n  {{ content | from_json({}, default={}) }}\n{%
          else %}\n  {{ {} }}\n{% endif %}"
        queue_payload_safe: '{{ queue_payload if queue_payload is mapping else {}
          }}'
        current_item: '{% set item = queue_payload_safe.get(''current_item'') %} {{
          item if item is mapping else {} }}'
        media_item: '{% set item = current_item.get(''media_item'') %} {{ item if
          item is mapping else {} }}'
        queue_extra_attributes: '{% set attrs = queue_payload_safe.get(''extra_attributes'')
          %} {{ attrs if attrs is mapping else {} }}'
        active_playlist_name: '{{ queue_extra_attributes.get(''active_playlist'',
          '''') }}'
        is_playbee_playlist: '{{ active_playlist_name.startswith(''PlayBee - '') }}'
        db_tag_name: "{% if active_playlist_name.startswith('PlayBee - ') %}\n  {{
          active_playlist_name | replace('PlayBee - ', '', 1) }}\n{% else %}\n  {{
          '' }}\n{% endif %}"
        resume_track_id: '{{ media_item.get(''uri'', '''') }}'
        resume_position: '{{ queue_payload_safe.get(''elapsed_time'', 0) | int(0)
          }}'
        resume_queue_id: '{{ queue_payload_safe.get(''queue_id'', '''') }}'
    - if:
      - condition: template
        value_template: '{{ is_playbee_playlist and db_tag_name not in ['''', ''unknown'',
          ''unavailable''] }}'
      then:
      - action: shell_command.playbee_db_get_tag_by_name
        data:
          tag_name: '{{ db_tag_name }}'
        response_variable: db_response
      - variables:
          db_tag: "{% if db_response.returncode == 0 and db_response.stdout | trim
            != '' %}\n  {{ db_response.stdout | from_json }}\n{% else %}\n  {{ {'found':
            false} }}\n{% endif %}"
          db_tag_found: '{{ db_tag.found | default(false) }}'
          db_tag_uid: '{{ db_tag.tag_uid | default('''') }}'
          db_tag_name_from_db: '{{ db_tag.name | default('''') }}'
      - if:
        - condition: template
          value_template: "{{\n  db_tag_found\n  and db_tag_uid not in ['', 'unknown',
            'unavailable']\n  and resume_queue_id not in ['', 'unknown', 'unavailable']\n
            \ and resume_track_id not in ['', 'unknown', 'unavailable']\n}}"
        then:
        - action: shell_command.playbee_db_save_resume
          data:
            tag_uid: '{{ db_tag_uid }}'
            track_id: '{{ resume_track_id }}'
            position: '{{ resume_position }}'
            queue_id: '{{ resume_queue_id }}'
        else:
        - action: system_log.write
          data:
            level: debug
            logger: playbee.nfc
            message: 'PlayBee save_resume: skipping save after DB lookup. reason={{
              reason | default(''unknown'') }}, active_playlist_name={{ active_playlist_name
              }}, db_tag_name={{ db_tag_name }}, db_tag_found={{ db_tag_found }},
              db_tag_uid={{ db_tag_uid }}, resume_queue_id={{ resume_queue_id }},
              resume_track_id={{ resume_track_id }}'
      else:
      - action: system_log.write
        data:
          level: debug
          logger: playbee.nfc
          message: 'PlayBee save_resume: current queue is not a PlayBee playlist.
            reason={{ reason | default(''unknown'') }}, active_playlist_name={{ active_playlist_name
            }}'
    else:
    - action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: 'PlayBee save_resume: queue lookup failed with status={{ queue_response.status
          if queue_response is mapping else ''unknown'' }}. reason={{ reason | default(''unknown'')
          }}, queue_response={{ queue_response }}'
playbee_volume_change:
  alias: PlayBee | Change volume
  mode: single
  fields:
    delta:
      required: true
  sequence:
  - variables:
      media_player: media_player.googlehome2758
      current_volume: '{{ state_attr(media_player, ''volume_level'') | float(0.05)
        }}'
      min_volume: 0.05
      max_volume: 0.15
      target_volume_raw: '{{ current_volume + (delta | float(0)) }}'
      target_volume_clamped: '{{ [[target_volume_raw, min_volume] | max, max_volume]
        | min }}'
      new_volume: '{{ (target_volume_clamped | float) | round(2) }}'
  - action: media_player.volume_set
    target:
      entity_id: '{{ media_player }}'
    data:
      volume_level: '{{ new_volume }}'
  description: ''
playbee_track_navigation:
  alias: PlayBee | Track navigation
  mode: single
  fields:
    action_type:
      name: Action type
      description: restart_current or previous_track
      required: true
      selector:
        select:
          options:
          - restart_current
          - previous_track
          - next_track
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''restart_current'' }}'
      sequence:
      - action: media_player.media_seek
        target:
          entity_id: media_player.googlehome2758
        data:
          seek_position: 0
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''previous_track'' }}'
      sequence:
      - action: media_player.media_previous_track
        target:
          entity_id: media_player.googlehome2758
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''next_track'' }}'
      sequence:
      - action: media_player.media_next_track
        target:
          entity_id: media_player.googlehome2758
  description: ''
