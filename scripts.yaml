delete_orphaned_database_entities:
  alias: Delete orphaned database entities
  sequence:
  - action: homeassistant.list_orphaned_database_entities
    response_variable: orphaned
  - action: recorder.purge_entities
    target:
      entity_id: '{{ orphaned.entities }}

        '
    data:
      keep_days: 0
  mode: single
  description: ''
playbee_play_media_based_on_nfc_tag:
  alias: PlayBee | Play media based on NFC tag
  mode: single
  fields:
    tag_uid:
      description: The scanned NFC tag UID
      required: true
  sequence:
  - alias: Load tag from PlayBee DB
    action: shell_command.playbee_db_get_tag_by_id
    data:
      tag_uid: '{{ tag_uid }}'
    response_variable: db_result
  - alias: Normalize playback and resume context
    variables:
      player_id: media_player.googlehome2758
      tag_row: "{% set raw = db_result.stdout | default('') | trim %} {% if db_result.returncode
        == 0 and raw != '' %}\n  {{ raw | from_json }}\n{% else %}\n  {{ {'found':
        false} }}\n{% endif %}"
      tag_found: '{{ tag_row.found | default(false) }}'
      playback_config: "{% from 'playbee.jinja' import normalize_on_off, normalize_repeat_mode
        %} {{\n  {\n    'media_url': tag_row.media_url | default(''),\n    'name':
        tag_row.name | default(''),\n    'shuffle': normalize_on_off(tag_row.shuffle_mode)
        | string | trim,\n    'repeat': normalize_repeat_mode(tag_row.repeat_mode)
        | string | trim\n  }\n}}"
      resume_context: "{% from 'playbee.jinja' import normalize_resume_mode %} {%
        from 'playbee_fn.jinja' import fn_ttl_seconds_from_resume_mode, fn_resume_payload_is_valid
        %} {% set ttl_seconds_from_resume_mode = fn_ttl_seconds_from_resume_mode |
        as_function %} {% set resume_payload_is_valid = fn_resume_payload_is_valid
        | as_function %} {% set normalized_mode = normalize_resume_mode(tag_row.resume_mode)
        | string | trim %} {% set payload = tag_row.resume_data | default(none) %}
        {% set last_updated_ts =\n  as_timestamp(payload.last_updated, 0) | int(0)\n
        \ if payload is mapping and payload.last_updated not in [none, '', 'unknown',
        'unavailable']\n  else 0\n%} {% set ttl_seconds = ttl_seconds_from_resume_mode(normalized_mode)
        | int(0) %} {% set age_seconds =\n  (as_timestamp(now()) - last_updated_ts)
        | int(0)\n  if last_updated_ts > 0\n  else -1\n%} {{\n  {\n    'mode': normalized_mode,\n
        \   'payload': payload,\n    'track_id': payload.track_id if payload is mapping
        else none,\n    'queue_id': payload.queue_id if payload is mapping else none,\n
        \   'position': payload.position | int(0) if payload is mapping else 0,\n
        \   'last_updated_ts': last_updated_ts,\n    'ttl_seconds': ttl_seconds,\n
        \   'age_seconds': age_seconds,\n    'has_data': resume_payload_is_valid(payload),\n
        \   'is_fresh': ttl_seconds > 0 and age_seconds >= 0 and age_seconds <= ttl_seconds\n
        \ }\n}}"
      tag_is_valid: "{% from 'playbee_fn.jinja' import fn_is_known_value %} {% set
        is_known_value = fn_is_known_value | as_function %} {{\n  tag_found and is_known_value(playback_config.media_url)\n}}"
      resume_should_run: "{{\n  resume_context.has_data and resume_context.is_fresh\n}}"
  - alias: Stop when tag is unknown or incomplete
    if:
    - condition: template
      value_template: '{{ not tag_is_valid }}'
    then:
    - action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: Unknown or incomplete NFC tag in DB. tag_uid={{ tag_uid }}, found={{
          tag_found }}, media_url={{ playback_config.media_url }}
    - stop: Unknown NFC tag
  - alias: Prepare player
    sequence:
    - alias: Clear queue
      action: media_player.clear_playlist
      target:
        entity_id: '{{ player_id }}'
    - alias: Apply shuffle
      action: media_player.shuffle_set
      target:
        entity_id: '{{ player_id }}'
      data:
        shuffle: '{{ playback_config.shuffle == ''on'' }}'
    - alias: Apply repeat
      action: media_player.repeat_set
      target:
        entity_id: '{{ player_id }}'
      data:
        repeat: '{{ playback_config.repeat }}'
  - alias: Log playback request
    action: system_log.write
    data:
      level: info
      logger: playbee.nfc
      message: 'PlayBee start playback: tag={{ tag_uid }}, media={{ playback_config.media_url
        }}, queue_id={{ resume_context.queue_id }}, shuffle={{ playback_config.shuffle
        }}, repeat={{ playback_config.repeat }}, resume_mode={{ resume_context.mode
        }}, resume_has_data={{ resume_context.has_data }}, resume_is_fresh={{ resume_context.is_fresh
        }}'
  - alias: Normalize mute
    action: media_player.volume_mute
    target:
      entity_id: '{{ player_id }}'
    data:
      is_volume_muted: false
  - alias: Start playback
    action: music_assistant.play_media
    target:
      entity_id: '{{ player_id }}'
    data:
      media_id: '{{ playback_config.media_url }}'
      media_type: playlist
      enqueue: replace
  - alias: Mark active tag
    action: input_text.set_value
    target:
      entity_id: input_text.playbee_active_tag_uid
    data:
      value: '{{ tag_uid }}'
  - alias: Resume playback when possible
    if:
    - condition: template
      value_template: '{{ resume_should_run }}'
    then:
    - alias: Log resume request
      action: system_log.write
      data:
        level: info
        logger: playbee.nfc
        message: 'PlayBee resume request: track={{ resume_context.track_id }}, position={{
          resume_context.position }}'
    - alias: Mute player before queue jump
      action: media_player.volume_mute
      target:
        entity_id: '{{ player_id }}'
      data:
        is_volume_muted: true
    - alias: Find queue item for saved track
      action: shell_command.playbee_queue_find_item_for_track
      data:
        queue_id: '{{ resume_context.queue_id }}'
        track_id: '{{ resume_context.track_id }}'
      response_variable: queue_lookup_result
    - alias: Stop when queue helper fails
      if:
      - condition: template
        value_template: '{{ queue_lookup_result.returncode != 0 }}'
      then:
      - action: system_log.write
        data:
          level: error
          logger: playbee.nfc
          message: PlayBee queue lookup failed. returncode={{ queue_lookup_result.returncode
            }}, stdout={{ queue_lookup_result.stdout }}, stderr={{ queue_lookup_result.stderr
            }}
      - action: media_player.volume_mute
        target:
          entity_id: '{{ player_id }}'
        data:
          is_volume_muted: false
      - stop: Queue lookup failed
    - alias: Parse queue lookup result
      variables:
        queue_match: "{% set raw = queue_lookup_result.stdout | default('') | trim
          %} {% if queue_lookup_result.returncode == 0 and raw.startswith('{') %}\n
          \ {{ raw | from_json }}\n{% else %}\n  {{ {} }}\n{% endif %}"
        queue_item_found: '{{ queue_match.get(''found'', false) }}'
        queue_item_id: '{{ queue_match.get(''queue_item_id'', '''') }}'
    - alias: Resume at matched queue item
      if:
      - condition: template
        value_template: '{{ queue_item_found and queue_item_id not in ['''', none]
          }}'
      then:
      - action: rest_command.playbee_ma_resume
        data:
          queue_id: '{{ resume_context.queue_id }}'
          item_id: '{{ queue_item_id }}'
          seek_position: '{{ resume_context.position }}'
        response_variable: resume_api_result
      - alias: Stop when Music Assistant resume fails
        if:
        - condition: template
          value_template: '{{ resume_api_result is not mapping or resume_api_result.status
            != 200 }}'
        then:
        - action: system_log.write
          data:
            level: error
            logger: playbee.nfc
            message: PlayBee resume failed. queue_item_id={{ queue_item_id }}, response={{
              resume_api_result }}
        - action: media_player.volume_mute
          target:
            entity_id: '{{ player_id }}'
          data:
            is_volume_muted: false
        - stop: Resume request failed
      else:
      - action: system_log.write
        data:
          level: warning
          logger: playbee.nfc
          message: Resume track not found in queue. tag={{ tag_uid }}, queue_id={{
            resume_context.queue_id }}, track_id={{ resume_context.track_id }}, helper_result={{
            queue_lookup_result.stdout }}
      - action: media_player.volume_mute
        target:
          entity_id: '{{ player_id }}'
        data:
          is_volume_muted: false
      - stop: Resume track not found
    - alias: Unmute after resume handling
      action: media_player.volume_mute
      target:
        entity_id: '{{ player_id }}'
      data:
        is_volume_muted: false
  description: ''
playbee_stop_media:
  alias: PlayBee | Stop media
  mode: single
  fields:
    reason:
      description: Optional stop reason for resume logging
      required: false
  sequence:
  - alias: Build stop context
    variables:
      player_id: media_player.googlehome2758
      stop_reason: '{{ reason | default(''stop'') }}'
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      active_tag_present: "{{\n  active_tag_uid not in ['', 'unknown', 'unavailable']\n}}"
  - alias: Save resume state
    action: script.playbee_save_resume
    data:
      reason: '{{ stop_reason }}'
  - alias: Stop playback
    action: media_player.media_stop
    target:
      entity_id: '{{ player_id }}'
  - alias: Wait for stop to settle
    delay: 00:00:01
  - alias: Clear remaining queue
    action: media_player.clear_playlist
    target:
      entity_id: '{{ player_id }}'
  - alias: Clear active tag marker when present
    if:
    - condition: template
      value_template: '{{ active_tag_present }}'
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.playbee_active_tag_uid
      data:
        value: ''
  description: ''
playbee_save_resume:
  alias: PlayBee | Save resume
  mode: single
  fields:
    reason:
      description: Optional trigger reason for logging
      required: false
  sequence:
  - alias: Build playback context
    variables:
      player_id: media_player.googlehome2758
      trigger_reason: '{{ reason | default(''unknown'') }}'
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      dev_tag_uids:
      - 04-3D-AA-EA-40-59-80
      playback_context: "{{\n  {\n    'is_dev_card': active_tag_uid in dev_tag_uids,\n
        \   'queue_id':\n      state_attr(player_id, 'active_queue')\n      or state_attr(player_id,
        'mass_queue_id')\n      or player_id\n  }\n}}"
  - alias: Load active queue from Music Assistant
    action: rest_command.playbee_ma_get_queue
    data:
      queue_id: '{{ playback_context.queue_id }}'
    response_variable: queue_result
  - alias: Continue only when queue lookup succeeded
    if:
    - condition: template
      value_template: '{{ queue_result is mapping and queue_result.status == 200 }}'
    then:
    - alias: Derive resume candidate from queue payload
      variables:
        queue_payload: "{% set content = queue_result.content if queue_result is mapping
          else none %} {% if content is mapping %}\n  {{ content }}\n{% elif content
          is string %}\n  {{ content | from_json({}, default={}) }}\n{% else %}\n
          \ {{ {} }}\n{% endif %}"
        resume_candidate: "{% set payload = queue_payload if queue_payload is mapping
          else {} %} {% set current_item = payload.get('current_item') if payload.get('current_item')
          is mapping else {} %} {% set streamdetails = current_item.get('streamdetails')
          if current_item.get('streamdetails') is mapping else {} %} {% set extra_attributes
          = payload.get('extra_attributes') if payload.get('extra_attributes') is
          mapping else {} %} {% set active_playlist_name = extra_attributes.get('active_playlist',
          '') %} {% set is_playbee_playlist = active_playlist_name.startswith('PlayBee
          - ') %} {% set db_tag_name =\n  active_playlist_name | replace('PlayBee
          - ', 'Dev - ', 1)\n  if playback_context.is_dev_card and active_playlist_name.startswith('PlayBee
          - ')\n  else active_playlist_name\n%} {% set provider = streamdetails.get('provider')
          | default('', true) %} {% set item_id = streamdetails.get('item_id') | default('',
          true) %} {% set resume_url =\n  provider ~ '://track/' ~ item_id\n  if provider
          and item_id\n  else ''\n%} {{\n  {\n    'active_playlist_name': active_playlist_name,\n
          \   'is_playbee_playlist': is_playbee_playlist,\n    'db_tag_name': db_tag_name,\n
          \   'queue_id': payload.get('queue_id', ''),\n    'position': payload.get('elapsed_time',
          0) | int(0),\n    'track_url': resume_url\n  }\n}}"
        resume_candidate_is_valid: "{{\n  resume_candidate.is_playbee_playlist\n  and
          resume_candidate.db_tag_name not in ['', 'unknown', 'unavailable']\n  and
          resume_candidate.track_url | length > 0\n}}"
    - alias: Save resume only for managed PlayBee playback
      if:
      - condition: template
        value_template: '{{ resume_candidate_is_valid }}'
      then:
      - alias: Resolve playlist name to tag entry
        action: shell_command.playbee_db_get_tag_by_name
        data:
          tag_name: '{{ resume_candidate.db_tag_name }}'
        response_variable: db_result
      - alias: Build tag lookup context
        variables:
          tag_lookup: "{% set raw = db_result.stdout | default('') | trim %} {% if
            db_result.returncode == 0 and raw != '' %}\n  {{ raw | from_json }}\n{%
            else %}\n  {{ {'found': false} }}\n{% endif %}"
          save_request: "{{\n  {\n    'tag_found': tag_lookup.found | default(false),\n
            \   'tag_uid': tag_lookup.tag_uid | default(''),\n    'tag_name': tag_lookup.name
            | default(''),\n    'queue_id': resume_candidate.queue_id,\n    'track_url':
            resume_candidate.track_url,\n    'position': resume_candidate.position\n
            \ }\n}}"
          save_request_is_valid: "{{\n  save_request.tag_found\n  and save_request.tag_uid
            not in ['', 'unknown', 'unavailable']\n  and save_request.queue_id not
            in ['', 'unknown', 'unavailable']\n  and save_request.track_url not in
            ['', 'unknown', 'unavailable']\n}}"
      - alias: Persist resume data
        if:
        - condition: template
          value_template: '{{ save_request_is_valid }}'
        then:
        - action: shell_command.playbee_db_save_resume
          data:
            tag_uid: '{{ save_request.tag_uid }}'
            track_id: '{{ save_request.track_url }}'
            position: '{{ save_request.position }}'
            queue_id: '{{ save_request.queue_id }}'
        else:
        - action: system_log.write
          data:
            level: debug
            logger: playbee.nfc
            message: 'PlayBee save_resume: skipping save after DB lookup. reason={{
              trigger_reason }}, active_tag_uid={{ active_tag_uid }}, is_dev_card={{
              playback_context.is_dev_card }}, active_playlist_name={{ resume_candidate.active_playlist_name
              }}, db_tag_name={{ resume_candidate.db_tag_name }}, db_tag_found={{
              save_request.tag_found }}, db_tag_uid={{ save_request.tag_uid }}, db_tag_name_from_db={{
              save_request.tag_name }}, resume_queue_id={{ save_request.queue_id }},
              resume_url={{ save_request.track_url }}'
      else:
      - action: system_log.write
        data:
          level: debug
          logger: playbee.nfc
          message: 'PlayBee save_resume: current queue is not a managed PlayBee playlist.
            reason={{ trigger_reason }}, active_tag_uid={{ active_tag_uid }}, is_dev_card={{
            playback_context.is_dev_card }}, active_playlist_name={{ resume_candidate.active_playlist_name
            }}, db_tag_name={{ resume_candidate.db_tag_name }}'
    else:
    - action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: 'PlayBee save_resume: queue lookup failed with status={{ queue_result.status
          if queue_result is mapping else ''unknown'' }}. reason={{ trigger_reason
          }}, active_tag_uid={{ active_tag_uid }}, queue_response={{ queue_result
          }}'
  description: ''
playbee_volume_change:
  alias: PlayBee | Change volume
  mode: single
  fields:
    delta:
      description: Relative volume change in the 0..1 range, e.g. 0.05 or -0.05
      required: true
  sequence:
  - alias: Derive bounded target volume
    variables:
      player_id: media_player.googlehome2758
      volume_policy: "{{\n  {\n    'min': 0.05,\n    'max': (states('input_number.playbee_speaker_max_volume')
        | int(10) / 100)\n  }\n}}"
      current_volume: "{{\n  state_attr(player_id, 'volume_level') | float(volume_policy.min)\n}}"
      target_volume: "{% set requested = current_volume + (delta | float(0)) %} {{\n
        \ [[requested, volume_policy.min] | max, volume_policy.max] | min | round(2)\n}}"
  - alias: Apply target volume
    action: media_player.volume_set
    target:
      entity_id: '{{ player_id }}'
    data:
      volume_level: '{{ target_volume }}'
  description: ''
playbee_track_navigation:
  alias: PlayBee | Track navigation
  mode: single
  fields:
    action_type:
      name: Action type
      description: restart_current, previous_track, or next_track
      required: true
      selector:
        select:
          options:
          - restart_current
          - previous_track
          - next_track
  sequence:
  - alias: Build navigation context
    variables:
      player_id: media_player.googlehome2758
      navigation_action: '{{ action_type | default('''', true) | string | trim }}'
  - alias: Apply requested navigation
    choose:
    - alias: Restart current track
      conditions:
      - condition: template
        value_template: '{{ navigation_action == ''restart_current'' }}'
      sequence:
      - action: media_player.media_seek
        target:
          entity_id: '{{ player_id }}'
        data:
          seek_position: 0
    - alias: Go to previous track
      conditions:
      - condition: template
        value_template: '{{ navigation_action == ''previous_track'' }}'
      sequence:
      - action: media_player.media_previous_track
        target:
          entity_id: '{{ player_id }}'
    - alias: Go to next track
      conditions:
      - condition: template
        value_template: '{{ navigation_action == ''next_track'' }}'
      sequence:
      - action: media_player.media_next_track
        target:
          entity_id: '{{ player_id }}'
    default:
    - alias: Log unsupported navigation action
      action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: 'PlayBee track navigation: unsupported action_type={{ navigation_action
          }}'
  description: ''
