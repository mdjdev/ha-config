delete_orphaned_database_entities:
  alias: Delete orphaned database entities
  sequence:
  - action: homeassistant.list_orphaned_database_entities
    response_variable: orphaned
  - action: recorder.purge_entities
    target:
      entity_id: '{{ orphaned.entities }}

        '
    data:
      keep_days: 0
  mode: single
  description: ''
playbee_play_media_based_on_nfc_tag:
  alias: PlayBee | Play media based on NFC tag
  mode: single
  fields:
    tag_uid:
      description: The scanned NFC tag UID
      required: true
  sequence:
  - action: shell_command.playbee_db_get_tag_by_id
    data:
      tag_uid: '{{ tag_uid }}'
    response_variable: db_response
    note: Look up the scanned tag in the PlayBee database
  - variables:
      tag: "{% if db_response.returncode == 0 and db_response.stdout | trim != ''
        %}\n  {{ db_response.stdout | from_json }}\n{% else %}\n  {{ {'found': false}
        }}\n{% endif %}"
      found: '{{ tag.found | default(false) }}'
      media_url: '{{ tag.media_url | default('''') }}'
      name: '{{ tag.name | default('''') }}'
      shuffle_mode: '{% set value = tag.shuffle_mode | default(''off'') | string |
        lower | trim %} {{ ''on'' if value in [''on'', ''true'', ''1'', ''yes''] else
        ''off'' }}'
      repeat_mode: "{% set value = tag.repeat_mode | default('off') | string | lower
        | trim %} {% if value in ['one', 'track', 'single', '1'] %}\n  one\n{% elif
        value in ['all', 'playlist', 'queue', 'on', 'true', '2', 'yes'] %}\n  all\n{%
        else %}\n  off\n{% endif %}"
      resume_mode: "{% set value = tag.resume_mode | default('off') | string | lower
        | trim %} {% if value in ['off', '', 'unknown', 'unavailable', 'none', 'false',
        '0', 'no'] %}\n  off\n{% elif value.endswith('d') and (value[:-1] | int(-1))
        >= 0 %}\n  {{ (value[:-1] | int(0)) ~ 'd' }}\n{% elif value.endswith('h')
        and (value[:-1] | int(-1)) >= 0 %}\n  {{ (value[:-1] | int(0)) ~ 'h' }}\n{%
        elif value | int(-1) >= 0 %}\n  {{ (value | int(0)) ~ 'h' }}\n{% else %}\n
        \ off\n{% endif %}"
      resume_data: '{{ tag.resume_data | default(none) }}'
      track_id: '{{ resume_data.track_id if resume_data is mapping else none }}'
      position: '{{ resume_data.position | int(0) if resume_data is mapping else 0
        }}'
      queue_id: '{{ resume_data.queue_id if resume_data is mapping else none }}'
      resume_last_updated: '{{ resume_data.last_updated if resume_data is mapping
        else none }}'
      resume_ttl_seconds: "{% set mode = resume_mode | string | lower | trim %} {%
        if mode == 'off' %}\n  0\n{% elif mode.endswith('d') and (mode[:-1] | int(-1))
        >= 0 %}\n  {{ (mode[:-1] | int(0)) * 86400 }}\n{% elif mode.endswith('h')
        and (mode[:-1] | int(-1)) >= 0 %}\n  {{ (mode[:-1] | int(0)) * 3600 }}\n{%
        else %}\n  0\n{% endif %}"
      resume_last_updated_ts: "{% if resume_last_updated not in [none, '', 'unknown',
        'unavailable'] %}\n  {{ as_timestamp(resume_last_updated, 0) | int(0) }}\n{%
        else %}\n  0\n{% endif %}"
      resume_age_seconds: "{% if resume_last_updated_ts | int(0) > 0 %}\n  {{ (as_timestamp(now())
        - (resume_last_updated_ts | int(0))) | int(0) }}\n{% else %}\n  -1\n{% endif
        %}"
      resume_has_data: "{{\n  resume_data is mapping\n  and track_id not in [none,
        '', 'unknown', 'unavailable']\n  and queue_id not in [none, '', 'unknown',
        'unavailable']\n}}"
      resume_is_fresh: "{{\n  resume_ttl_seconds | int(0) > 0\n  and resume_age_seconds
        | int(-1) >= 0\n  and resume_age_seconds | int(0) <= resume_ttl_seconds |
        int(0)\n}}"
      do_resume: '{{ resume_has_data and resume_is_fresh }}'
      media_player: media_player.googlehome2758
    note: Extract tag settings and decide whether a resume attempt is possible
  - if:
    - condition: template
      value_template: '{{ not found or media_url in ['''', ''unknown'', ''unavailable'']
        }}'
      note: Stop early if the tag is unknown or has no usable media URL
    then:
    - action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: Unknown or incomplete NFC tag in DB. tag_uid={{ tag_uid }}, found={{
          found }}, media_url={{ media_url }}
      note: Log invalid tag data for later troubleshooting
    - stop: Unknown NFC tag
  - action: input_text.set_value
    target:
      entity_id: input_text.playbee_active_tag_uid
    data:
      value: '{{ tag_uid }}'
    note: Mark this tag as the currently active PlayBee tag
  - action: media_player.clear_playlist
    target:
      entity_id: '{{ media_player }}'
    note: Clear the player queue before rebuilding it for fresh playback or indexed
      resume
  - action: media_player.shuffle_set
    target:
      entity_id: '{{ media_player }}'
    data:
      shuffle: '{{ shuffle_mode == ''on'' }}'
    note: Set shuffle before playback has started
  - action: media_player.repeat_set
    target:
      entity_id: '{{ media_player }}'
    data:
      repeat: '{{ repeat_mode }}'
    note: Set repeat before playback has started
  - action: system_log.write
    data:
      level: info
      logger: playbee.nfc
      message: 'PlayBee start playback: tag={{ tag_uid }}, media={{ media_url }},
        queue_id={{ queue_id }}, shuffle_mode={{ shuffle_mode }}, repeat_mode={{ repeat_mode
        }}, resume_mode={{ resume_mode }}, resume_has_data={{ resume_has_data }},
        resume_is_fresh={{ resume_is_fresh }}'
    note: Record playback input
  - action: music_assistant.play_media
    target:
      entity_id: '{{ media_player }}'
    data:
      media_id: '{{ media_url }}'
      media_type: playlist
      enqueue: replace
    note: Start playlist playback through the Music Assistant action so the full queue
      is built reliably in all cases
  - if:
    - condition: template
      value_template: '{{ do_resume }}'
      note: Resume only when stored queue and track data are present and TTL is still
        valid
    then:
    - action: system_log.write
      data:
        level: info
        logger: playbee.nfc
        message: 'PlayBee resuming track:  track={{ track_id }}, position={{ position
          }}'
      note: Log resume input
    - action: media_player.volume_mute
      target:
        entity_id: '{{ media_player }}'
      data:
        is_volume_muted: true
      note: Temporarily mute the player so the queue jump does not create an audible
        track change
    - action: shell_command.playbee_queue_find_item_for_track
      data:
        queue_id: '{{ queue_id }}'
        track_id: '{{ track_id }}'
      response_variable: queue_match_response
      note: Query Music Assistant from the helper script and return only the matched
        queue item id and index
    - if:
      - condition: template
        value_template: '{{ queue_match_response.returncode != 0 }}'
        note: Abort when the helper script fails to query or parse Music Assistant
          queue items
      then:
      - action: system_log.write
        data:
          level: error
          logger: playbee.nfc
          message: PlayBee queue match helper failed. returncode={{ queue_match_response.returncode
            }}, stdout={{ queue_match_response.stdout }}, stderr={{ queue_match_response.stderr
            }}
        note: Preserve stdout and stderr from the queue lookup helper for troubleshooting
      - action: media_player.volume_mute
        target:
          entity_id: '{{ media_player }}'
        data:
          is_volume_muted: false
        note: Unmute before stopping
      - stop: Queue match helper failed
    - variables:
        queue_match: "{% set raw = queue_match_response.stdout | trim %} {% if queue_match_response.returncode
          == 0 and raw.startswith('{') %}\n  {{ raw | from_json }}\n{% else %}\n  {{
          {} }}\n{% endif %}"
        matched_queue_item_id: '{{ queue_match.get(''queue_item_id'', '''') }}'
        matched_index: '{{ queue_match.get(''index'', -1) }}'
        matched_found: '{{ queue_match.get(''found'', false) }}'
      note: Parse the compact queue lookup result returned by the helper script
    - if:
      - condition: template
        value_template: '{{ matched_found and matched_queue_item_id not in ['''',
          none] }}'
        note: Continue only when the helper found the stored track in the rebuilt
          queue
      then:
      - action: rest_command.playbee_ma_resume
        data:
          queue_id: '{{ queue_id }}'
          item_id: '{{ matched_queue_item_id }}'
          seek_position: '{{ position }}'
        response_variable: resume_response
        note: Jump directly to the matched queue item id and send the seek position
          in the same Music Assistant API call
      - if:
        - condition: template
          value_template: '{{ resume_response is not mapping or resume_response.status
            != 200 }}'
          note: Abort when Music Assistant rejects the play-index request for the
            matched queue item id
        then:
        - action: system_log.write
          data:
            level: error
            logger: playbee.nfc
            message: PlayBee resume failed. queue_item_id={{ matched_queue_item_id
              }}, index={{ matched_index }}, response={{ resume_response }}
          note: Preserve the play-index failure together with the matched queue identifiers
        - action: media_player.volume_mute
          target:
            entity_id: '{{ media_player }}'
          data:
            is_volume_muted: false
          note: Unmute before stopping
        - stop: Play index failed
      else:
      - action: system_log.write
        data:
          level: warning
          logger: playbee.nfc
          message: Resume track not found in queue. tag={{ tag_uid }}, queue_id={{
            queue_id }}, track_id={{ track_id }}, helper_result={{ queue_match_response.stdout
            }}
        note: Log helper output when the stored track cannot be found in the rebuilt
          queue
      - action: media_player.volume_mute
        target:
          entity_id: '{{ media_player }}'
        data:
          is_volume_muted: false
        note: Unmute before stopping
      - stop: Resume track not found
    - action: media_player.volume_mute
      target:
        entity_id: '{{ media_player }}'
      data:
        is_volume_muted: false
      note: Unmute the player after the playback target has been selected
  description: ''
playbee_stop_media:
  alias: PlayBee | Stop media
  mode: single
  fields:
    reason:
      required: false
  sequence:
  - variables:
      media_player: media_player.googlehome2758
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      has_active_tag: '{{ active_tag_uid not in ['''', ''unknown'', ''unavailable'']
        }}'
    note: Gather current player and active tag state before stopping
  - action: script.playbee_save_resume
    data:
      reason: '{{ reason | default(''stop'') }}'
    note: Save queue position before stopping playback
  - action: media_player.media_stop
    target:
      entity_id: '{{ media_player }}'
    note: Stop playback on the PlayBee target player
  - delay: 00:00:01
    note: Short delay so the stop command settles before clearing the queue
  - action: media_player.clear_playlist
    target:
      entity_id: '{{ media_player }}'
    note: Remove remaining queue items after stopping
  - if:
    - condition: template
      value_template: '{{ has_active_tag }}'
      note: Only clear the helper when a tag is currently marked as active
    then:
    - action: input_text.set_value
      target:
        entity_id: input_text.playbee_active_tag_uid
      data:
        value: ''
      note: Reset the active tag helper after playback ends
playbee_save_resume:
  alias: PlayBee | Save resume
  mode: single
  fields:
    reason:
      required: false
  sequence:
  - variables:
      media_player: media_player.googlehome2758
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      dev_tag_uids:
      - 04-3D-AA-EA-40-59-80
      queue_id: "{{\n  state_attr(media_player, 'active_queue')\n  or state_attr(media_player,
        'mass_queue_id')\n  or media_player\n}}"
    note: Determine the active Music Assistant queue id for the target player
  - action: rest_command.playbee_ma_get_queue
    data:
      queue_id: '{{ queue_id }}'
    response_variable: queue_response
    note: Fetch queue state from Music Assistant to inspect current playback
  - if:
    - condition: template
      value_template: '{{ queue_response is mapping and queue_response.status == 200
        }}'
      note: Continue only when queue inspection succeeded
    then:
    - variables:
        is_dev_card: '{{ active_tag_uid in dev_tag_uids }}'
        queue_payload: "{% set content = queue_response.content if queue_response
          is mapping else none %} {% if content is mapping %}\n  {{ content }}\n{%
          elif content is string %}\n  {{ content | from_json({}, default={}) }}\n{%
          else %}\n  {{ {} }}\n{% endif %}"
        queue_payload_safe: '{{ queue_payload if queue_payload is mapping else {}
          }}'
        current_item: '{% set item = queue_payload_safe.get(''current_item'') %} {{
          item if item is mapping else {} }}'
        media_item: '{% set item = current_item.get(''media_item'') %} {{ item if
          item is mapping else {} }}'
        streamdetails: '{% set item = current_item.get(''streamdetails'') %} {{ item
          if item is mapping else {} }}'
        queue_extra_attributes: '{% set attrs = queue_payload_safe.get(''extra_attributes'')
          %} {{ attrs if attrs is mapping else {} }}'
        active_playlist_name: '{{ queue_extra_attributes.get(''active_playlist'',
          '''') }}'
        is_playbee_playlist: '{{ active_playlist_name.startswith(''PlayBee - '') }}'
        db_tag_name: "{% set playlist = active_playlist_name %} {% if is_dev_card
          and playlist.startswith('PlayBee - ') %}\n  {{ playlist | replace('PlayBee
          - ', 'Dev - ', 1) }}\n{% else %}\n  {{ playlist }}\n{% endif %}"
        resume_provider: '{{ streamdetails.get(''provider'') | default('''', true)
          }}'
        resume_item_id: '{{ streamdetails.get(''item_id'') | default('''', true) }}'
        resume_url: "{% if resume_provider and resume_item_id %}\n  {{ resume_provider
          }}://track/{{ resume_item_id }}\n{% else %}\n  {{ '' }}\n{% endif %}"
        resume_position: '{{ queue_payload_safe.get(''elapsed_time'', 0) | int(0)
          }}'
        resume_queue_id: '{{ queue_payload_safe.get(''queue_id'', '''') }}'
      note: Extract playlist identity, current track, and elapsed position from queue
        data
    - if:
      - condition: template
        value_template: "{{\n  is_playbee_playlist\n  and db_tag_name not in ['',
          'unknown', 'unavailable']\n  and resume_url | length > 0\n}}"
        note: Save resume only for PlayBee-managed playlists with a usable track id
      then:
      - action: shell_command.playbee_db_get_tag_by_name
        data:
          tag_name: '{{ db_tag_name }}'
        response_variable: db_response
        note: Resolve the effective playlist name back to its NFC tag entry
      - variables:
          db_tag: "{% if db_response.returncode == 0 and db_response.stdout | trim
            != '' %}\n  {{ db_response.stdout | from_json }}\n{% else %}\n  {{ {'found':
            false} }}\n{% endif %}"
          db_tag_found: '{{ db_tag.found | default(false) }}'
          db_tag_uid: '{{ db_tag.tag_uid | default('''') }}'
          db_tag_name_from_db: '{{ db_tag.name | default('''') }}'
        note: Parse the database lookup result for the active playlist name
      - if:
        - condition: template
          value_template: "{{\n  db_tag_found\n  and db_tag_uid not in ['', 'unknown',
            'unavailable']\n  and resume_queue_id not in ['', 'unknown', 'unavailable']\n
            \ and resume_url not in ['', 'unknown', 'unavailable']\n}}"
          note: Only write resume data when tag, queue, and track identifiers are
            valid
        then:
        - action: shell_command.playbee_db_save_resume
          data:
            tag_uid: '{{ db_tag_uid }}'
            track_id: '{{ resume_url }}'
            position: '{{ resume_position }}'
            queue_id: '{{ resume_queue_id }}'
          note: Persist resume data for later playback continuation
        else:
        - action: system_log.write
          data:
            level: debug
            logger: playbee.nfc
            message: 'PlayBee save_resume: skipping save after DB lookup. reason={{
              reason | default(''unknown'') }}, active_tag_uid={{ active_tag_uid }},
              is_dev_card={{ is_dev_card }}, active_playlist_name={{ active_playlist_name
              }}, db_tag_name={{ db_tag_name }}, db_tag_found={{ db_tag_found }},
              db_tag_uid={{ db_tag_uid }}, db_tag_name_from_db={{ db_tag_name_from_db
              }}, resume_queue_id={{ resume_queue_id }}, resume_url={{ resume_url
              }}'
          note: Log why resume data was not written after tag lookup
      else:
      - action: system_log.write
        data:
          level: debug
          logger: playbee.nfc
          message: 'PlayBee save_resume: current queue is not a managed PlayBee playlist.
            reason={{ reason | default(''unknown'') }}, active_tag_uid={{ active_tag_uid
            }}, is_dev_card={{ is_dev_card }}, active_playlist_name={{ active_playlist_name
            }}, db_tag_name={{ db_tag_name }}'
        note: Ignore playback that was not started by a PlayBee playlist
    else:
    - action: system_log.write
      data:
        level: warning
        logger: playbee.nfc
        message: 'PlayBee save_resume: queue lookup failed with status={{ queue_response.status
          if queue_response is mapping else ''unknown'' }}. reason={{ reason | default(''unknown'')
          }}, active_tag_uid={{ active_tag_uid }}, queue_response={{ queue_response
          }}'
      note: Log failed queue lookups because resume data cannot be updated
playbee_volume_change:
  alias: PlayBee | Change volume
  mode: single
  fields:
    delta:
      required: true
  sequence:
  - variables:
      media_player: media_player.googlehome2758
      current_volume: '{{ state_attr(media_player, ''volume_level'') | float(0.05)
        }}'
      min_volume: 0.05
      max_volume: '{{ states(''input_number.playbee_speaker_max_volume'') | int(10)
        / 100 }}'
      target_volume_raw: '{{ current_volume + (delta | float(0)) }}'
      target_volume_clamped: '{{ [[target_volume_raw, min_volume] | max, max_volume]
        | min }}'
      new_volume: '{{ (target_volume_clamped | float) | round(2) }}'
    note: Clamp the requested volume into the safe PlayBee range
  - action: media_player.volume_set
    target:
      entity_id: '{{ media_player }}'
    data:
      volume_level: '{{ new_volume }}'
    note: Apply the new bounded volume to the player
  description: ''
playbee_track_navigation:
  alias: PlayBee | Track navigation
  mode: single
  fields:
    action_type:
      name: Action type
      description: restart_current or previous_track
      required: true
      selector:
        select:
          options:
          - restart_current
          - previous_track
          - next_track
  sequence:
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''restart_current'' }}'
        note: Restart the current track from the beginning
      sequence:
      - action: media_player.media_seek
        target:
          entity_id: media_player.googlehome2758
        data:
          seek_position: 0
        note: Seek to zero instead of changing queue position
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''previous_track'' }}'
        note: Move to the previous queue item
      sequence:
      - action: media_player.media_previous_track
        target:
          entity_id: media_player.googlehome2758
        note: Ask the player to go to the previous track
    - conditions:
      - condition: template
        value_template: '{{ action_type == ''next_track'' }}'
        note: Move to the next queue item
      sequence:
      - action: media_player.media_next_track
        target:
          entity_id: media_player.googlehome2758
        note: Ask the player to go to the next track
  description: ''
playbee_make_announcement:
  alias: PlayBee | Make announcement
  mode: queued
  fields:
    message:
      required: true
  sequence:
  - variables:
      media_player: media_player.googlehome2758
  - target:
      entity_id: tts.piper
    data:
      media_player_entity_id: '{{ media_player }}'
      message: '{{ message }}'
    action: tts.speak
  - wait_template: '{{ not is_state(media_player, ''playing'') }}'
    timeout: 00:00:10
    continue_on_timeout: true
  - delay: 00:00:01
