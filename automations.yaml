- id: '1757877683393'
  alias: Batterie-Monitor | Austausch Benachrichtigen
  description: ''
  triggers:
  - trigger: event
    event_type: battery_notes_battery_threshold
    event_data:
      battery_low: true
  conditions: []
  actions:
  - action: system_log.write
