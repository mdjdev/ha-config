- id: '1778873511403'
  alias: musiCosy 2 | Batterie Benachrichtigung
  description: ''
  triggers:
  - trigger: time
    at: 06:30:00
  - trigger: time
    at: '18:00:00'
  conditions:
  - condition: numeric_state
    entity_id: sensor.musicosy_2_battery_level
    below: 60
  actions:
  - action: script.mobile_send_notification
    data:
      recipients:
      - obsidian
      title: musiCosy 2
      message: '{{ states(''sensor.musicosy_2_battery_level'') }}% verbleibend'
      tag: '{{ this.entity_id }}'
      notification_icon: mdi:watering-can-outline
  mode: single
- id: '1780944090810'
  alias: PlayBee | NFC event router
  description: ''
  triggers:
  - trigger: event
    event_type: tag_scanned
    event_data:
      device_id: 5027c31bfe14b567944562578ee195bd
    id: scanned_v1
    note: Trigger when PlayBee reader v1 scans a tag
  - trigger: event
    event_type: tag_scanned
    event_data:
      device_id: b9cdc2845d361b7c7ef05d864ad713a1
    id: scanned_v2
    note: Trigger when PlayBee reader v2 scans a tag
  - trigger: state
    entity_id: binary_sensor.playbee_tagreader_card_present
    from: 'on'
    to: 'off'
    for:
      seconds: 0
    id: removed_v1
    note: Trigger only when reader v1 stays off for x seconds
  - trigger: state
    entity_id:
    - binary_sensor.playbee_tagreader_v2_card_present
    to:
    - 'off'
    for:
      seconds: 0
    id: removed_v2
    note: Trigger only when reader v2 stays off for x seconds
  conditions: []
  actions:
  - variables:
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      has_active_tag: '{{ active_tag_uid not in ['''', ''unknown'', ''unavailable'']
        }}'
      scanned_tag_uid: "{% if trigger.platform == 'event'\n      and trigger.event
        is defined\n      and trigger.event.data is defined\n      and trigger.event.data.tag_id
        is defined %}\n  {{ trigger.event.data.tag_id }}\n{% else %}\n  {{ '' }}\n{%
        endif %}"
    note: Normalize current active tag and scanned tag id
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''scanned_v1'', ''scanned_v2''] }}'
        note: Only handle PlayBee scan events in this branch
      - condition: template
        value_template: '{{ not has_active_tag }}'
        note: Do not start new playback while a tag is active (same or different)
      - condition: template
        value_template: '{{ scanned_tag_uid not in ['''', ''unknown'', ''unavailable'']
          }}'
        note: Require a usable scanned tag id
      sequence:
      - action: script.playbee_play_media_based_on_nfc_tag
        data:
          tag_uid: '{{ scanned_tag_uid }}'
        note: Start or resume playback for the scanned tag
    - conditions:
      - condition: template
        value_template: '{{ trigger.id in [''removed_v1'', ''removed_v2''] }}'
        note: Only handle confirmed removal in this branch
      - condition: template
        value_template: '{{ has_active_tag }}'
        note: Only stop when a PlayBee tag is currently active
      sequence:
      - action: script.playbee_stop_media
        data:
          reason: card_removed
        note: Save resume state and stop playback after the card is removed
  mode: queued
  max: 20
- id: '1781201586519'
  alias: PlayBee | Save resume on pause
  description: ''
  triggers:
  - trigger: state
    entity_id: media_player.playbee_speaker
    to: paused
    note: Trigger when the PlayBee player is paused
  conditions: []
  actions:
  - action: script.playbee_save_resume
    data:
      reason: paused
    note: Persist current queue item and elapsed time when playback is paused
  mode: queued
  max: 10
- id: '1781201650514'
  alias: PlayBee | Save resume heartbeat
  description: ''
  triggers:
  - trigger: time_pattern
    seconds: /30
    note: Run every 30 seconds while something is playing
  conditions:
  - condition: state
    entity_id: media_player.playbee_speaker
    state: playing
    note: Only save heartbeat resume data during active playback
  actions:
  - action: script.playbee_save_resume
    data:
      reason: heartbeat
    note: Periodically refresh resume data during playback
  mode: queued
  max: 10
- id: '1781207699805'
  alias: PlayBee | Volume control
  description: ''
  triggers:
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: dial_rotate_right_fast
    id: right_fast
    note: Large volume increase
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: dial_rotate_right_slow
    id: right_slow
    note: Medium volume increase
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: dial_rotate_right_step
    id: right_step
    note: Small volume increase
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: dial_rotate_left_fast
    id: left_fast
    note: Large volume decrease
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: dial_rotate_left_slow
    id: left_slow
    note: Medium volume decrease
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: dial_rotate_left_step
    id: left_step
    note: Small volume decrease
  conditions: []
  actions:
  - variables:
      delta: "{% if trigger.id == 'right_fast' %}\n  0.04\n{% elif trigger.id == 'right_slow'
        %}\n  0.02\n{% elif trigger.id == 'right_step' %}\n  0.01\n{% elif trigger.id
        == 'left_fast' %}\n  -0.04\n{% elif trigger.id == 'left_slow' %}\n  -0.02\n{%
        elif trigger.id == 'left_step' %}\n  -0.01\n{% else %}\n  0\n{% endif %}"
    note: Convert dial gesture into a signed volume delta
  - action: script.playbee_volume_change
    data:
      delta: '{{ delta }}'
    note: Apply the calculated volume delta to the player
  mode: restart
- id: '1781208891845'
  alias: PlayBee | Track navigation (restart/previous)
  description: ''
  triggers:
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: button_1_press_release
    note: Single press may mean restart current or previous track (depending if second
      press follows within timeout)
  conditions: []
  actions:
  - wait_for_trigger:
    - trigger: device
      domain: mqtt
      device_id: e16744d488d2d95cfa461b0b10cfd240
      type: action
      subtype: button_1_press_release
      note: Second press within timeout means previous track
    timeout: '00:00:01.00'
    continue_on_timeout: true
    note: Distinguish single press from double press
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ wait.trigger is not none }}'
        note: Double press detected
      sequence:
      - action: script.playbee_track_navigation
        data:
          action_type: previous_track
        note: Jump to previous track on double press
    default:
    - action: script.playbee_track_navigation
      data:
        action_type: restart_current
      note: Restart current track on single press
  mode: single
- id: '1781209105040'
  alias: PlayBee | Track navigation (next)
  description: ''
  triggers:
  - trigger: device
    domain: mqtt
    device_id: e16744d488d2d95cfa461b0b10cfd240
    type: action
    subtype: button_2_press_release
    note: Advance to the next track
  conditions: []
  actions:
  - action: script.playbee_track_navigation
    data:
      action_type: next_track
    note: Send next track command to the shared navigation script
  mode: single
- id: '1781900740272'
  alias: PlayBee | Enforce max volume
  description: ''
  triggers:
  - trigger: media_player.volume_crossed_threshold
    target:
      entity_id: media_player.playbee_speaker
    options:
      threshold:
        type: above
        value:
          entity: input_number.playbee_speaker_max_volume
  actions:
  - action: media_player.volume_set
    target:
      entity_id: media_player.playbee_speaker
    data:
      volume_level: '{{ states(''input_number.playbee_speaker_max_volume'') | float(10)
        / 100 }}'
  mode: queued
  max: 10
- id: '1782331154638'
  alias: PlayBee | Database backup
  description: ''
  triggers:
  - trigger: time_pattern
    hours: '*'
    minutes: '0'
  conditions:
  - condition: time
    after: '10:00:00'
    before: '23:00:00'
  actions:
  - action: shell_command.playbee_export_json
    metadata: {}
    data: {}
  mode: single
- id: '1782643855442'
  alias: PlayBee | Clear stale active tag helper
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - binary_sensor.playbee_tagreader_v2_card_present
    to:
    - 'off'
    for:
      hours: 0
      minutes: 0
      seconds: 2
  - trigger: state
    entity_id:
    - media_player.playbee_speaker
    to:
    - idle
    - 'off'
    - standby
    for:
      hours: 0
      minutes: 0
      seconds: 2
  conditions:
  - condition: template
    value_template: '{{ states(''input_text.playbee_active_tag_uid'') not in ['''',
      ''unknown'', ''unavailable''] }}'
  actions:
  - action: input_text.set_value
    target:
      entity_id: input_text.playbee_active_tag_uid
    data:
      value: ''
  mode: single
- id: '1784489014241'
  alias: musiCosy | Batterie Benachrichtigung pausieren
  description: 'Sets the matching dismissal state after the Reset action is pressed
    and removes the matching notification from the phone.

    '
  triggers:
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: MUSICOSY_BATTERY_DISMISS
    id: dismiss_musicosy
  - trigger: event
    event_type: mobile_app_notification_action
    event_data:
      action: MUSICOSY_2_BATTERY_DISMISS
    id: dismiss_musicosy_2
  actions:
  - alias: Handle selected dismiss action
    choose:
    - alias: Dismiss musiCosy notification
      conditions:
      - alias: Check for musiCosy dismiss action
        condition: trigger
        id: dismiss_musicosy
      sequence:
      - alias: Mark musiCosy notification as dismissed
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.musicosy_battery_notification_dismissed
      - alias: Clear musiCosy notification on Obsidian
        action: script.mobile_send_notification
        data:
          recipients:
          - obsidian
          must_be_home: false
          message: clear_notification
          tag: musicosy.battery_low
    - alias: Dismiss musiCosy 2 notification
      conditions:
      - alias: Check for musiCosy 2 dismiss action
        condition: trigger
        id: dismiss_musicosy_2
      sequence:
      - alias: Mark musiCosy 2 notification as dismissed
        action: input_boolean.turn_on
        target:
          entity_id: input_boolean.musicosy_2_battery_notification_dismissed
      - alias: Clear musiCosy 2 notification on Obsidian
        action: script.mobile_send_notification
        data:
          recipients:
          - obsidian
          must_be_home: false
          message: clear_notification
          tag: musicosy_2.battery_low
  mode: queued
  max: 10
- id: '1784489777086'
  alias: musiCosy | Batterie Benachrichtigung zurücksetzen
  description: 'Re-arms the relevant low-battery notification whenever that headphone''s
    battery level changes in either direction.

    '
  triggers:
  - trigger: state
    entity_id: sensor.musicosy_battery_level
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    id: recovered_musicosy
  - trigger: state
    entity_id: sensor.musicosy_2_battery_level
    not_from:
    - unknown
    - unavailable
    not_to:
    - unknown
    - unavailable
    id: recovered_musicosy_2
  actions:
  - alias: Reset matching dismissal state
    choose:
    - alias: Recover musiCosy notification
      conditions:
      - alias: Check for musiCosy battery change
        condition: trigger
        id: recovered_musicosy
      sequence:
      - alias: Re-arm musiCosy low-battery notification
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musicosy_battery_notification_dismissed
    - alias: Recover musiCosy 2 notification
      conditions:
      - alias: Check for musiCosy 2 battery change
        condition: trigger
        id: recovered_musicosy_2
      sequence:
      - alias: Re-arm musiCosy 2 low-battery notification
        action: input_boolean.turn_off
        target:
          entity_id: input_boolean.musicosy_2_battery_notification_dismissed
  mode: queued
  max: 10
- id: '1785179360681'
  alias: System | Auto-commit HA version
  description: Automatically commit and push .HA_VERSION to git when HA starts after
    an update
  triggers:
  - trigger: homeassistant
    event: start
  conditions: []
  actions:
  - action: shell_command.commit_ha_version
    continue_on_error: true
  mode: single
