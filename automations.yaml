- id: '1746040248436'
  alias: musiCosy | Batterie Benachrichtigung anzeigen
  description: 'Sends scheduled low-battery reminders for both musiCosy headphones
    when their battery level is below 60% and their reminder has not been dismissed.

    '
  triggers:
  - trigger: time
    at: 06:30:00
    id: scheduled_morning
  - trigger: time
    at: '18:00:00'
    id: scheduled_evening
  - trigger: time
    at: '22:00:00'
    id: scheduled_night
  actions:
  - alias: Check and notify for both headphones
    sequence:
    - alias: Check and notify for musiCosy
      if:
      - alias: musiCosy battery is below 60 percent
        condition: numeric_state
        entity_id: sensor.musicosy_battery_level
        below: 60
      - alias: musiCosy notification is not dismissed
        condition: state
        entity_id: input_boolean.musicosy_battery_notification_dismissed
        state: 'off'
      then:
      - alias: Send musiCosy low-battery notification
        action: script.mobile_send_notification
        data:
          recipients:
          - obsidian
          must_be_home: false
          title: musiCosy
          message: "{{ states('sensor.musicosy_battery_level')\n   | float(0) | round(0)
            | int }}% verbleibend\n"
          tag: musicosy.battery_low
          notification_icon: mdi:headphones-battery
          actions:
          - action: MUSICOSY_BATTERY_DISMISS
            title: Reset
    - alias: Check and notify for musiCosy 2
      if:
      - alias: musiCosy 2 battery is below 60 percent
        condition: numeric_state
        entity_id: sensor.musicosy_2_battery_level
        below: 60
      - alias: musiCosy 2 notification is not dismissed
        condition: state
        entity_id: input_boolean.musicosy_2_battery_notification_dismissed
        state: 'off'
      then:
      - alias: Send musiCosy 2 low-battery notification
        action: script.mobile_send_notification
        data:
          recipients:
          - obsidian
          must_be_home: false
          title: musiCosy 2
          message: "{{ states('sensor.musicosy_2_battery_level')\n   | float(0) |
            round(0) | int }}% verbleibend\n"
          tag: musicosy_2.battery_low
          notification_icon: mdi:headphones-battery
          actions:
          - action: MUSICOSY_2_BATTERY_DISMISS
            title: Reset
  mode: queued
  max: 10
- id: '1750364021950'
  alias: Flur | Luftentfeuchter Kombi
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  - event_type: automation_reloaded
    trigger: event
  - minutes: /5
    trigger: time_pattern
  actions:
  - variables:
      humidity: "{% set s1 = states(sensor1) | float(0) %}\n{% set s2 = states(sensor2)
        | float(0) %}\n{% set count = (s1 > 0) + (s2 > 0) %}\n{% if count > 0 %}\n
        \ {{ (s1 + s2) / count }}\n{% else %}\n  0\n{% endif %}"
  - data:
      level: info
      message: 'Sensor 1: {{ sensor1 }},

        Sensor 2: {{ sensor2 }},

        Humidity: {{ humidity }}'
    action: system_log.write
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ humidity < humidity_low }}'
      sequence:
      - target:
          entity_id: '{{ switch }}'
        action: switch.turn_off
        data: {}
    - conditions:
      - condition: template
        value_template: '{{ humidity > humidity_high }}'
      sequence:
      - target:
          entity_id: '{{ switch }}'
        action: switch.turn_on
        data: {}
  - delay: 00:01:00
  mode: single
  variables:
    sensor1: sensor.vorratsraum_temperatur_und_luftfeuchtigkeitssensor_humidity
    sensor2: sensor.werkraum_temperatur_und_luftfeuchtigkeitssensor_humidity
    switch: switch.vorratsraum_steckdose_luftentfeuchter_schalter
    humidity_low: 62
    humidity_high: 64
