- id: '1729888215580'
  alias: Waschküche | Luftentfeuchter
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  - event_type: automation_reloaded
    trigger: event
  - minutes: /5
    trigger: time_pattern
  conditions:
  - condition: state
    entity_id: binary_sensor.hmip_keller_waschkuche_fenster
    state: 'off'
  - condition: template
    value_template: '{{ sensor != '''' and switch != '''' }}'
  - condition: template
    value_template: '{% set humidity = states(sensor) | float(0) %} {{ humidity <
      humidity_low or humidity > humidity_high }}

      '
  actions:
  - data:
      level: info
      message: 'Sensor: {{ sensor }}, Switch: {{ switch }}, Humidity: {{ states(sensor)
        | float(0) }}'
    action: system_log.write
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ states(sensor) | float(0) < humidity_low }}'
      sequence:
      - target:
          entity_id: '{{ switch }}'
        action: switch.turn_off
        data: {}
    - conditions:
      - condition: template
        value_template: '{{ states(sensor) | float(0) > humidity_high }}'
      sequence:
      - target:
          entity_id: '{{ switch }}'
        action: switch.turn_on
        data: {}
  - delay: 00:01:00
  mode: single
  variables:
    device: input_select.waschkueche_luftentfeuchter_standort
    sensor: "{% if is_state(device, 'Waschküche') %}\n  sensor.waschkuche_temperatur_und_luftfeuchtigkeitssensor_humidity\n{%
      elif is_state(device, 'Treppenhaus') %}\n  sensor.keller_treppenhaus_temperatur_und_luftfeuchtigkeitssensor_humidity\n{%
      else %}\n  ''\n{% endif %}\n"
    switch: "{% if is_state(device, 'Waschküche') %}\n  switch.waschkuche_steckdose_luftentfeuchter\n{%
      elif is_state(device, 'Treppenhaus') %}\n  switch.waschkuche_steckdose_luftentfeuchter\n{%
      else %}\n  ''\n{% endif %}\n"
    humidity_low: 62
    humidity_high: 65
- id: '1729889123165'
  alias: Fenster | Benachrichtigungen anzeigen
  description: ''
  triggers:
  - minutes: /1
    trigger: time_pattern
  - entity_id: binary_sensor.pixel_9_pro_obsidian_ping
    to: 'on'
    for:
      minutes: 2
    trigger: state
  - entity_id: binary_sensor.pixel_9_pro_hazel_ping
    to: 'on'
    for:
      minutes: 2
    trigger: state
  conditions:
  - condition: template
    value_template: "{{ states.binary_sensor\n   | selectattr('entity_id', 'match',
      'binary_sensor.*(fenster|schiebetur)$')\n   | selectattr('state', 'eq', 'on')\n
      \  | list | length > 0 }}"
  actions:
  - repeat:
      for_each: "{{ states.binary_sensor\n   | selectattr('entity_id', 'match', 'binary_sensor.*(fenster|schiebetur)$')\n
        \  | selectattr('state', 'eq', 'on')\n   | map(attribute='entity_id')\n   |
        list }}"
      sequence:
      - variables:
          sensor_id: '{{ repeat.item }}'
          sensor_name: '{{ state_attr(sensor_id, ''friendly_name'') | replace(''HmIP
            '', '''') }}'
          open_minutes: "{{ ((as_timestamp(now()) - as_timestamp(states[sensor_id].last_changed))
            // 60)\n   | round(0, 'ceil') }}"
          notification_delay: "{% if trigger.to_state is defined and trigger.to_state.state
            == 'on' %}\n  0\n{% elif open_minutes <= 6 %}\n  {{ open_minutes % 2 }}\n{%
            elif open_minutes <= 30 %}\n  {{ open_minutes % 5 }}\n{% elif open_minutes
            <= 60 %}\n  {{ open_minutes % 10 }}\n{% elif open_minutes <= 120 %}\n
            \ {{ open_minutes % 15 }}\n{% elif open_minutes <= 180 %}\n  {{ open_minutes
            % 30 }}\n{% else %}\n  {{ open_minutes % 60 }}\n{% endif %}"
      - condition: template
        value_template: '{{ notification_delay | int == 0 }}'
      - action: script.mobile_send_notification
        data:
          recipients:
          - obsidian
          title: '{{ sensor_name }}'
          message: "{% if open_minutes <= 1 %}\n  1 Minute\n{% elif open_minutes <=
            180 %}\n  {{ open_minutes }} Minuten\n{% else %}\n  {{ open_minutes //
            60 | int }} Stunden\n{% endif %}"
          tag: '{{ sensor_id }}'
          notification_icon: mdi:weather-windy
