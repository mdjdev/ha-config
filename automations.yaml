  - choose:
    - conditions:
      - condition: template
        value_template: '{{ humidity < humidity_low }}'
      sequence:
      - target:
          entity_id: '{{ switch }}'
        action: switch.turn_off
        data: {}
    - conditions:
      - condition: template
        value_template: '{{ humidity > humidity_high }}'
      sequence:
      - target:
          entity_id: '{{ switch }}'
        action: switch.turn_on
        data: {}
  - delay: 00:01:00
