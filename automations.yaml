          title: Als ersetzt markieren
  mode: queued
- id: '1758796768373'
  alias: HAGit - 1 | Schlüsselpaar erstellen
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  conditions:
  - condition: state
    entity_id: binary_sensor.hagit_privater_schlussel_existiert
    state: 'off'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''ha_start'' }}'
    then:
    - delay: 00:00:15
  - action: shell_command.hagit_init_keys
  mode: single
- id: '1758874422023'
  alias: HAGit - 2 | Authentifizierung prüfen
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
    id: ha_start
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: state
    entity_id: binary_sensor.hagit_privater_schlussel_existiert
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''ha_start'' }}'
    then:
    - delay: 00:00:20
  - data: {}
    response_variable: ssh_auth_response
    action: shell_command.hagit_check_auth
  - if:
    - condition: template
      value_template: '{{ ssh_auth_response[''returncode''] == 0 }}'
    then:
    - target:
        entity_id: input_boolean.hagit_authentifizierung_erfolgreich
      action: input_boolean.turn_on
    - action: repairs.remove
      data:
        issue_id: ha_git_auth_failed
    else:
    - target:
        entity_id: input_boolean.hagit_authentifizierung_erfolgreich
      action: input_boolean.turn_off
    - data:
        title: 'HAGit: Authentifizierung fehlgeschlagen'
        description: 'Die Authentifizierung für GitLab ist fehlgeschlagen:


          `{{ ssh_auth_response[''stderr''] }}`


          Die wahrscheinlichste Ursache ist, dass der öffentliche Schlüssel

          `id_rsa_github.pub` nicht in GitHub hinterlegt ist.


          Füge den öffentlichen Schlüssel unter folgendem Link hinzu:


          [https://github.com/settings/ssh/new](https://github.com/settings/ssh/new)'
        issue_id: ha_git_auth_failed
        severity: critical
        domain: homeassistant
      action: repairs.create
  mode: single
- id: '1758879740596'
  alias: HAGit - 5 | Änderungen commiten
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  - trigger: state
    entity_id: binary_sensor.hagit_git_status
    to: 'on'
    for: 00:02:00
  conditions:
  - condition: state
    entity_id: binary_sensor.hagit_git_initialisiert
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hagit_gitignore_existiert
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hagit_privater_schlussel_existiert
    state: 'on'
  - condition: state
    entity_id: input_boolean.hagit_authentifizierung_erfolgreich
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''ha_start'' }}'
    then:
    - delay: 00:00:30
  - action: shell_command.hagit_commit_changes
    response_variable: commit_changes_response
    data: {}
  - action: system_log.write
    data:
      level: info
      message: '{{ commit_changes_response }}'
  mode: single
- id: '1758880242528'
  alias: HAGit - 4 | Repository initialisieren
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  - entity_id: input_boolean.hagit_authentifizierung_erfolgreich
    from: 'off'
    to: 'on'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.hagit_git_initialisiert
    state: 'off'
  - condition: state
    entity_id: binary_sensor.hagit_gitignore_existiert
    state: 'on'
  - condition: state
    entity_id: binary_sensor.hagit_privater_schlussel_existiert
    state: 'on'
  - condition: state
    entity_id: input_boolean.hagit_authentifizierung_erfolgreich
    state: 'on'
  actions:
  - if:
    - condition: template
      value_template: '{{ trigger.id == ''ha_start'' }}'
    then:
    - delay: 00:00:25
  - action: shell_command.hagit_init_repo
    response_variable: init_repo_response
    data: {}
  - action: system_log.write
    data:
      level: info
      message: '{{ init_repo_response }}'
  mode: single
- id: '1758986597447'
  alias: HAGit - 3 | .gitignore schreiben
  description: ''
  triggers:
  - event: start
    trigger: homeassistant
  - event_type: automation_reloaded
    trigger: event
  actions:
  - action: shell_command.hagit_write_gitignore
    data:
      content: '# Ignore everything

        *


        # But don''t ignore directories, so Git can traverse them

        !*/


        # Explicitly include these files and folders

        !/.storage/lovelace.dashboard_*

        !/shell_commands/**

        !.gitkeep

        !/automations.yaml

        !/configuration.yaml

        !/scenes.yaml

        !/scripts.yaml

        '
  mode: single
- id: '1773090275291'
  alias: Chromium Heartbeat
  description: ''
  triggers:
  - trigger: time_pattern
    minutes: /5
  conditions:
  - condition: time
    weekday:
    - mon
    - tue
    - wed
    - thu
    - fri
    after: 07:00:00
    before: '18:00:00'
  - condition: state
    entity_id: device_tracker.mb_m1_dm
    state: home
  actions:
  - action: shell_command.keep_chromium_awake
  mode: single
- id: '1776797661447'
  alias: Garten | Bewässerung starten
  description: ''
  triggers:
  - trigger: time
    at: '11:00:00'
  - trigger: time
    at: '13:00:00'
  - trigger: time
    at: '19:00:00'
  actions:
  - target:
      entity_id: switch.garten_bewasserung_schalter
    action: switch.turn_on
    data: {}
  - data:
      message: 'Garten | Bewässerung gestartet

        '
      data:
        tag: '{{ this.entity_id }}'
        ttl: 0
        priority: high
        notification_icon: mdi:watering-can-outline
    action: notify.mobile_app_obsidian
  mode: single
  max: 10
- id: '1776798681627'
  alias: Garten | Bewässerung beendet
  description: ''
  triggers:
  - trigger: state
    entity_id:
    - switch.garten_bewasserung_schalter
    to:
    - 'on'
    for:
      hours: 0
      minutes: 10
      seconds: 0
  conditions: []
  actions:
  - action: switch.turn_off
    target:
      entity_id:
      - switch.garten_bewasserung_schalter
    data: {}
  - data:
      message: 'Garten | Bewässerung beendet

        '
      data:
        tag: '{{ this.entity_id }}'
        ttl: 0
        priority: high
        notification_icon: mdi:watering-can-outline
    action: notify.mobile_app_obsidian
  mode: single
  max: 10
- id: '1778873511403'
  alias: musiCosy 2 | Batterie Benachrichtigung
  description: ''
  triggers:
  - trigger: time
    at: 06:30:00
  - trigger: time
    at: '18:00:00'
  conditions:
  - condition: numeric_state
    entity_id: sensor.musicosy_2_battery_level
    below: 60
  actions:
  - data:
      title: musiCosy 2
      message: '{{ states(''sensor.musicosy_2_battery_level'') }}%'
    action: notify.mobile_app_obsidian
  mode: single
- id: '1780944090810'
  alias: PlayBee | NFC event router
  description: ''
  triggers:
  - trigger: event
    event_type: tag_scanned
    id: scanned
  - trigger: state
    entity_id: binary_sensor.playbee_tagreader_card_present
    from: 'on'
    to: 'off'
    id: removed
  conditions: []
  actions:
  - variables:
      active_tag_uid: '{{ states(''input_text.playbee_active_tag_uid'') }}'
      has_active_tag: '{{ active_tag_uid not in ['''', ''unknown'', ''unavailable'']
        }}'
      scanned_tag_uid: "{% if trigger.id == 'scanned'\n      and trigger.event is
        defined\n      and trigger.event.data is defined\n      and trigger.event.data.tag_id
        is defined %}\n  {{ trigger.event.data.tag_id }}\n{% else %}\n  {{ '' }}\n{%
        endif %}"
      scanned_device_id: "{% if trigger.id == 'scanned'\n      and trigger.event is
        defined\n      and trigger.event.data is defined\n      and trigger.event.data.device_id
        is defined %}\n  {{ trigger.event.data.device_id }}\n{% else %}\n  {{ '' }}\n{%
        endif %}"
  - choose:
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''scanned'' }}'
      - condition: template
        value_template: '{{ scanned_device_id == ''5027c31bfe14b567944562578ee195bd''
          }}'
      - condition: template
        value_template: '{{ not has_active_tag }}'
      - condition: template
        value_template: '{{ scanned_tag_uid not in ['''', ''unknown'', ''unavailable'']
          }}'
      sequence:
      - action: script.playbee_play_media_based_on_nfc_tag
        data:
          tag_uid: '{{ scanned_tag_uid }}'
    - conditions:
      - condition: template
        value_template: '{{ trigger.id == ''removed'' }}'
      - condition: template
        value_template: '{{ has_active_tag }}'
      sequence:
      - action: script.playbee_stop_media
        data:
          reason: card_removed
  mode: queued
  max: 20
