- id: '1719350560957'
  alias: Eufy Robovac | Nicht abgeschlossen Benachrichtigung mit Action
  description: ''
  triggers:
  - at: 07:30:00
    trigger: time
  conditions:
  - condition: state
    entity_id: vacuum.robovac
    state: idle
  actions:
  - repeat:
      for_each: "{{ states.device_tracker\n  | selectattr('entity_id', 'match', 'device_tracker.*(oneplus_8_pro|huawei_p20_pro)$')\n
        \ | selectattr('state', 'eq', 'home')\n  | map(attribute='entity_id')\n  |
        list }}"
      sequence:
      - variables:
          device_id: '{{ repeat.item }}'
          device_name: "{% if device_id == 'device_tracker.oneplus_8_pro' %}\n  in2023\n{%
            elif device_id == 'device_tracker.huawei_p20_pro' %}\n  clt_l09\n{% else
            %}\n  unknown\n{% endif %}"
      - condition: template
        value_template: '{{ device_name != ''unknown'' }}'
      - action: script.mobile_send_notification
        data:
          title: Eufy Robovac
          message: Tägliche Reinigung wurde nicht abgeschlossen
          tag: vacuum.robovac.idle
          notification_icon: mdi:robot-vacuum-off
          actions:
          - action: VACUUM_CONTINUE
            title: Starten
  mode: single
