        }}.
      data:
        tag: '{{ trigger.event.data.device_name }}'
        ttl: 0
        priority: high
        notification_icon: mdi:battery
        clickAction: /dashboard-batteries
        actions:
        - action: BATTERY_REPLACED
          title: Als ersetzt markieren
  mode: queued
- id: '1773090275291'
