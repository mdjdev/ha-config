substitutions:
  name: esp32-bluetooth-proxy-7373d0
  friendly_name: Bluetooth Proxy UG

packages:
  esphome.bluetooth-proxy: github://esphome/bluetooth-proxies/esp32-generic/esp32-generic.yaml@main

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp32:
  framework:
    advanced:
      minimum_chip_revision: "3.1"
      sram1_as_iram: true

api:
  encryption:
    key: !secret esp32_bluetooth_proxy_7373d0__encryption_key

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: NONE
  reboot_timeout: 5min
  # output_power: 8.5dB
