substitutions:
  name: playbee-tagreader-v2
  friendly_name: PlayBee TagReader v2

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}

captive_portal:

logger:

api:
  encryption:
    key: !secret playbee_tagreader_v2__encryption_key

ota:
  - platform: esphome

spi:
  clk_pin: D5
  miso_pin: D6
  mosi_pin: D7

pn532_spi:
  cs_pin: D4
  update_interval: 500ms
  on_tag:
    then:
      - text_sensor.template.publish:
          id: current_tag_uid
          state: !lambda 'return x;'
      - binary_sensor.template.publish:
          id: card_present
          state: ON
      - homeassistant.tag_scanned: !lambda 'return x;'

  on_tag_removed:
    then:
      - text_sensor.template.publish:
          id: current_tag_uid
          state: ""
      - binary_sensor.template.publish:
          id: card_present
          state: OFF

button:
  - platform: restart
    name: "Restart"
    id: device_restart
    entity_category: diagnostic

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: template
    name: "Card Present"
    id: card_present
    device_class: presence

text_sensor:
  - platform: template
    name: "Current Tag UID"
    id: current_tag_uid
    update_interval: never
    icon: mdi:nfc

  - platform: version
    hide_timestamp: true
    name: "ESPHome Version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic