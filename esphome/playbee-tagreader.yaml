substitutions:
  name: playbee-tagreader
  friendly_name: PlayBee TagReader

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: false

esp8266:
  board: d1_mini

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: ${name}

captive_portal:

logger:

api:

ota:
  - platform: esphome

i2c:
  scan: false
  frequency: 100kHz
  timeout: 2ms

globals:
  - id: active_uid
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: last_announced_uid
    type: std::string
    restore_value: no
    initial_value: '""'

  - id: tag_locked
    type: bool
    restore_value: no
    initial_value: "false"

  - id: tag_confirmed
    type: bool
    restore_value: no
    initial_value: "false"

script:
  - id: confirm_scan
    mode: restart
    parameters:
      uid: string
    then:
      - logger.log:
          format: "Candidate tag %s detected, waiting 1000ms before confirming"
          args: [ 'uid.c_str()' ]
      - delay: 1000ms
      - if:
          condition:
            lambda: |-
              return id(tag_locked) &&
                     id(active_uid) == uid &&
                     !id(tag_confirmed);
          then:
            - lambda: |-
                id(tag_confirmed) = true;
                id(last_announced_uid) = uid;
            - text_sensor.template.publish:
                id: current_tag_uid
                state: !lambda 'return uid;'
            - binary_sensor.template.publish:
                id: card_present
                state: ON
            - logger.log:
                format: "Confirmed tag %s, sending tag_scanned"
                args: [ 'uid.c_str()' ]
            - homeassistant.tag_scanned: !lambda 'return uid;'

  - id: confirm_removed
    mode: restart
    then:
      - logger.log: "Raw tag removed, waiting to confirm removal"
      - delay: 2500ms
      - lambda: |-
          ESP_LOGD("tagreader", "Removal confirmed, clearing active tag '%s'", id(active_uid).c_str());
          id(active_uid).clear();
          id(last_announced_uid).clear();
          id(tag_locked) = false;
          id(tag_confirmed) = false;
      - text_sensor.template.publish:
          id: current_tag_uid
          state: ""
      - binary_sensor.template.publish:
          id: card_present
          state: OFF

pn532_i2c:
  id: pn532_board
  update_interval: 500ms

  on_tag:
    then:
      - script.stop: confirm_removed
      - if:
          condition:
            lambda: 'return !id(tag_locked);'
          then:
            - lambda: |-
                id(active_uid) = x;
                id(tag_locked) = true;
                id(tag_confirmed) = false;
                ESP_LOGD("tagreader", "Accepted candidate tag: %s", x.c_str());
            - script.execute:
                id: confirm_scan
                uid: !lambda 'return x;'
      - if:
          condition:
            lambda: 'return id(tag_locked) && id(active_uid) != x;'
          then:
            - logger.log:
                format: "Ignoring tag %s while active tag %s is locked"
                args: [ 'x.c_str()', 'id(active_uid).c_str()' ]

  on_tag_removed:
    then:
      - if:
          condition:
            lambda: 'return id(tag_locked);'
          then:
            - script.execute: confirm_removed

binary_sensor:
  - platform: status
    name: "Status"
    entity_category: diagnostic

  - platform: template
    name: "Card Present"
    id: card_present
    device_class: presence

text_sensor:
  - platform: template
    name: "Current Tag UID"
    id: current_tag_uid
    update_interval: never
    icon: mdi:nfc

  - platform: version
    hide_timestamp: true
    name: "ESPHome Version"
    entity_category: diagnostic

  - platform: wifi_info
    ip_address:
      name: "IP Address"
      icon: mdi:wifi
      entity_category: diagnostic
    ssid:
      name: "Connected SSID"
      icon: mdi:wifi-strength-2
      entity_category: diagnostic