sidebareditable: false
analytics: false
hideall: true

js_variables:
  group_paths:
    apps:
      - /config/apps/installed
      - _adguard
      - _zigbee2mqtt
      - /core_configurator # File editor
      - _music_assistant
      - _sqlite-web
      - _esphome
      - _ssh # Terminal
      - _logviewer
      - _home-assistant-version-control
      - /entity_manager
    system:
      - /config/dashboard
      - /config/developer-tools
      - _hassio_google_drive_backup
      - /history
      - /logbook

jsrefs:
  system_group_open: false
  apps_group_open: false

order:

  - item: Home
    exact: true
    hide: false

  - new_item: true
    item: Geräte & Dienste
    href: /config/integrations
    icon: mdi:devices

  - new_item: true
    item: Automationen
    href: /config/automation
    icon: mdi:robot

  - item: HACS
    exact: true
    hide: false

  - new_item: true
    item: apps_group_toggle
    name: Apps
    icon: |
      [[[
        const open = refs.apps_group_open;
        const current = window.location.pathname;
        const active = group_paths.apps.some(
          (path) => current === path || current.includes(path)
        );
        return (open || active) ? 'mdi:chevron-down' : 'mdi:puzzle';
      ]]]
    attributes:
      data-group-item: "true"
    on_click:
      action: javascript
      code: |
        refs.apps_group_open = !refs.apps_group_open;

  - new_item: true
    item: Installiert
    href: /config/apps/installed
    icon: mdi:puzzle
    hide: |
      [[[
        const open = refs.apps_group_open;
        const current = window.location.pathname;
        const active = group_paths.apps.some(
          (path) => current === path || current.includes(path)
        );
        return !(open || active);
      ]]]
    attributes:
      data-nested-item: "true"

