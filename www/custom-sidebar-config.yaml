styles: |
  ha-list-item-button[data-group-item="true"] {
    font-weight: 600;
    margin: 4px 4px 2px 4px;
    background: transparent !important;
  }

  ha-list-item-button[data-nested-item="true"] {
    margin: 0 4px !important;
    padding-left: 0 !important;
    background: transparent !important;
    border-radius: 8px;
  }

  ha-list-item-button[data-nested-item="true"]:hover {
    background: rgba(255, 255, 255, 0.035) !important;
  }

  ha-list-item-button[data-nested-item="true"] [slot="start"] {
    margin-left: 14px !important;
    opacity: 0.72;
  }

  ha-list-item-button[data-nested-item="true"] .item-text {
    padding-left: 8px !important;
    opacity: 0.92;
  }