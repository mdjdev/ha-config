styles: |
  ha-md-list-item[data-nested-item="true"] {
    --nested-hover-bg: rgba(37, 37, 37, 1);
    --md-ripple-hover-opacity: 0 !important;
    --custom-sidebar-item-background-hover-opacity: 0 !important;

    position: relative;
    margin-left: 0 !important;
    padding-left: 0 !important;
  }

  ha-md-list-item[data-nested-item="true"]::before {
    left: 4px !important;
    right: -4px !important;
    border-radius: inherit !important;
  }

  ha-md-list-item[data-nested-item="true"]:not(.selected)::before {
    background: transparent !important;
    opacity: 0 !important;
  }

  ha-md-list-item[data-nested-item="true"]:hover:not(.selected)::before {
    background: var(--nested-hover-bg) !important;
    opacity: 1 !important;
  }

  ha-md-list-item[data-nested-item="true"]::after {
    content: "";
    position: absolute;
    left: 12px;
    top: 10px;
    bottom: 10px;
    width: 1px;
    background: rgba(255, 255, 255, 0.14);
    pointer-events: none;
    z-index: 2;
  }

  ha-md-list-item[data-nested-item="true"] .item-text {
    padding-left: 0 !important;
  }

  ha-md-list-item[data-nested-item="true"] ha-icon[slot="start"],
  ha-md-list-item[data-nested-item="true"] ha-svg-icon[slot="start"] {
    margin-left: 8px !important;
    opacity: 0.82;
  }

  ha-md-list-item[data-group-item="true"] {
    font-weight: 600;
  }
